<script>
(function(){
  const f = document.getElementById('authForm');
  const s = document.getElementById('switchMode');
  const nameField = document.getElementById('nameField');
  const submitBtn = f && f.querySelector('button[type=submit]');
  if (!f || !s) return;

  s.addEventListener('click', () => {
    const mode = f.getAttribute('data-mode') || 'login';

    if (mode === 'login') {
      f.setAttribute('data-mode','signup');
      nameField.style.display = '';
      submitBtn.setAttribute('data-i18n','auth.signup');
      s.setAttribute('data-i18n','auth.switchToLogin');
    } else {
      f.setAttribute('data-mode','login');
      nameField.style.display = 'none';
      submitBtn.setAttribute('data-i18n','auth.login');
      s.setAttribute('data-i18n','auth.switchToSignup');
    }

    if (typeof applyLang === 'function') applyLang(getLang());
  });

  if (f && f.getAttribute('data-backend') === 'true') {
    f.addEventListener('submit', async (e) => {
      e.preventDefault();

      const mode = f.getAttribute('data-mode') || 'login';
      const email = (document.getElementById('authEmail')||{}).value || '';
      const pwd = (document.getElementById('authPassword')||{}).value || '';
      const name = (document.getElementById('authName')||{}).value || '';

      try {
        const url = mode === 'signup' ? '/api/signup' : '/api/login';

        const res = await fetch(url,{
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body:JSON.stringify({email,password:pwd,name})
        });

        if (!res.ok) {
          const j = await res.json().catch(()=>({detail:'error'}));
          alert(j.detail || 'Auth error');
          return;
        }

        const j = await res.json();

        if (j.email) {
          localStorage.setItem('lumina_user',JSON.stringify({
            email:j.email,
            name:j.name
          }));
        }

        location.href = '/account.html';

      } catch(err){
        alert('Network error');
      }
    });
  }
})();
</script>
