<!doctype html>

<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Lumina — Connexion</title>
  <link rel="stylesheet" href="styles.css" />
  <script defer src="app.js"></script>
</head>

<body class="page-login">

<header class="header">
  <div class="container header__inner">

<!-- ✅ logo uniforme -->
<a class="brand" href="index.html">
  <span class="brand__name">Lumina</span>
</a>

<nav class="nav">
  <a class="nav__link" href="index.html" data-i18n="nav.home">Accueil</a>
  <a class="nav__link" href="search.html" data-i18n="nav.search">Recherche</a>
  <a class="nav__link" href="about.html" data-i18n="nav.about">À propos / Contact</a>
  <a class="nav__link active" id="accountLink" href="login.html" data-i18n="auth.login">Se connecter</a>
</nav>

<button class="btn btn--ghost" id="langBtn" type="button" data-i18n-aria-label="button.langChange">FR</button>


  </div>
</header>

<main>
  <section class="section">
    <div class="container">


  <!-- ✅ card centrée -->
  <div class="card" style="max-width:420px;margin:40px auto;">

    <div class="card__header">
      <div>
        <div class="card__title" data-i18n="auth.title">
          Connexion / Inscription
        </div>

        <div class="card__subtitle muted" data-i18n="auth.subtitle">
          Prototype client-side auth (no backend)
        </div>
      </div>
    </div>

    <div class="card__body">

      <form id="authForm" data-mode="login" data-backend="true">

        <div class="field">
          <label for="authEmail" data-i18n="auth.email">Email</label>
          <input
            id="authEmail"
            type="email"
            data-i18n-placeholder="auth.emailPh"
            required
          />
        </div>

        <div class="field" id="nameField" style="display:none">
          <label for="authName" data-i18n="auth.name">Nom</label>
          <input
            id="authName"
            data-i18n-placeholder="auth.namePh"
          />
        </div>

        <div class="field">
          <label for="authPassword" data-i18n="auth.password">Mot de passe</label>
          <input
            id="authPassword"
            type="password"
            required
          />
        </div>

        <div class="row" style="justify-content:center;margin-top:10px;">
          
          <!-- ✅ bouton glass -->
          <button
            id="authSubmit"
            class="btn-glass"
            type="submit"
            data-i18n="auth.login">
            Se connecter
          </button>

        </div>

        <div class="row" style="justify-content:center;margin-top:10px;">
          <button
            id="switchMode"
            class="btn btn--ghost"
            type="button"
            data-i18n="auth.switchToSignup">
            S'inscrire
          </button>
        </div>

        <div style="margin-top:16px;text-align:center;">
          <a
            id="googleBtn"
            class="btn btn--ghost"
            href="http://localhost:8001/api/auth/google"
            data-i18n="auth.googleSignin">
            Se connecter avec Google
          </a>
        </div>

      </form>

    </div>

  </div>

</div>


  </section>
</main>

<footer class="footer">
  <div class="container footer__inner">
    <span class="muted small">
      ©<span data-i18n="footer.brand">Lumina</span> — CSC 317
    </span>
    <span class="muted small" data-i18n="footer.right">
      French creator
    </span>
  </div>
</footer>

<script>
(function(){
  const f = document.getElementById('authForm');
  const s = document.getElementById('switchMode');
  const nameField = document.getElementById('nameField');
  const submitBtn = f && f.querySelector('button[type=submit]');
  if (!f || !s) return;

  s.addEventListener('click', () => {
    const mode = f.getAttribute('data-mode') || 'login';

    if (mode === 'login') {
      f.setAttribute('data-mode','signup');
      nameField.style.display = '';
      submitBtn.setAttribute('data-i18n','auth.signup');
      s.setAttribute('data-i18n','auth.switchToLogin');
    } else {
      f.setAttribute('data-mode','login');
      nameField.style.display = 'none';
      submitBtn.setAttribute('data-i18n','auth.login');
      s.setAttribute('data-i18n','auth.switchToSignup');
    }

    if (typeof applyLang === 'function') applyLang(getLang());
  });

  if (f && f.getAttribute('data-backend') === 'true') {
    f.addEventListener('submit', async (e) => {
      e.preventDefault();

      const mode = f.getAttribute('data-mode') || 'login';
      const email = (document.getElementById('authEmail')||{}).value || '';
      const pwd = (document.getElementById('authPassword')||{}).value || '';
      const name = (document.getElementById('authName')||{}).value || '';

      try {
        const url = mode === 'signup' ? 'http://localhost:8001/api/signup' : 'http://localhost:8001/api/login';

        const res = await fetch(url,{
          method:'POST',
          credentials:'include',
          headers:{'Content-Type':'application/json'},
          body:JSON.stringify({email,password:pwd,name})
        });

        if (!res.ok) {
          const j = await res.json().catch(()=>({detail:'error'}));
          alert(j.detail || 'Auth error');
          return;
        }

        const j = await res.json();

        if (j.email) {
          localStorage.setItem('lumina_user',JSON.stringify({
            email:j.email,
            name:j.name
          }));
        }

        location.href = '/account.html';

      } catch(err){
        alert('Network error');
      }
    });
  }
})();
</script>

</body>
</html>
