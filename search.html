<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Lumina — Recherche</title>
  <link rel="stylesheet" href="styles.css" />
  <script defer src="app.js"></script>
</head>

<body class="page-search">
  <header class="header">
    <div class="container header__inner">
     <a class="brand" href="index.html">
  <span class="brand__name">Lumina</span>
</a>

      <nav class="nav">
        <a class="nav__link" href="index.html" data-i18n="nav.home">Accueil</a>
        <a class="nav__link active" href="search.html" data-i18n="nav.search">Recherche</a>
        <a class="nav__link" href="about.html" data-i18n="nav.about">À propos / Contact</a>
        <a class="nav__link" id="accountLink" href="login.html" data-i18n="auth.login">Se connecter</a>
      </nav>

      <button class="btn btn--ghost" id="langBtn" type="button" data-i18n-aria-label="button.langChange" aria-label="Changer la langue">FR</button>
      <button class="nav__toggle" data-i18n-aria-label="button.toggleMenu" aria-label="Ouvrir le menu">☰</button>
    </div>
  </header>

  <main>
    <section class="section">
      <div class="container">
        <div class="section__head">
          <h2 data-i18n="search.title">Recherche</h2>
           
          </p>
        </div>

        <div class="grid grid--2">
          <div class="card">
            <div class="card__header">
              <div>
                <div class="card__title" data-i18n="search.title">Recherche</div>
              </div>
            </div>

            <div class="card__body">
              <div class="form">
                <div class="field">
                  <label for="q" data-i18n="form.liked.label">Film que tu as aimé</label>
                  <input id="q" data-i18n-placeholder="form.liked.ph" placeholder="Ex : Inception, The Notebook, The Dark Knight..." />
                </div>

                <div class="row">
                 <button id="searchBtn" type="button" class="btn-glass" data-i18n="form.search">Rechercher</button>
                 <span id="status" class="muted small"></span>
                </div>
              </div>
            </div>
          </div>

          <div class="card">
            <div class="card__header">
              <div>
                <div class="card__title" data-i18n="results.title">Résultats</div>
              </div>
            </div>

            <div class="card__body">
              <div id="results" class="results">
                <div class="empty">
                  <div class="empty__title" data-i18n="results.emptyTitle">Lance une recherche</div>
                  <div class="muted small" data-i18n="results.emptyText">Tu verras ici des films recommandés.</div>
                </div>
              </div>
            </div>
          </div>
        </div>

      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container footer__inner">
      <span class="muted small">©<span data-i18n="footer.brand">Lumina</span> — CSC 317</span>
      <span class="muted small" data-i18n="footer.right">French creator</span>
    </div>
  </footer>
</body>
</html>
