<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Lumina Film — Détails du film</title>
  <link rel="stylesheet" href="styles.css" />
  <script defer src="app.js"></script>
</head>

<body class="page-movie">
  <header class="header">
    <div class="container header__inner">
      <a class="brand" href="index.html">
        <span class="brand__icon"></span>
        <span class="brand__text">
          <span class="brand__name">Lumina </span>
          <span class="brand__tag" data-i18n="brand.tag">Prototype</span>
        </span>
      </a>

      <nav class="nav">
        <a class="nav__link" href="index.html" data-i18n="nav.home">Accueil</a>
        <a class="nav__link" href="search.html" data-i18n="nav.search">Recherche</a>
        <a class="nav__link" href="about.html" data-i18n="nav.about">À propos / Contact</a>
        <a class="nav__link" id="accountLink" href="login.html">Se connecter</a>
      </nav>

      <button class="btn btn--ghost" id="langBtn" type="button" aria-label="Changer la langue">FR</button>
      <button class="nav__toggle" aria-label="Ouvrir le menu">☰</button>
    </div>
  </header>

  <main>
    <section class="section">
      <div class="container">
        <div id="movieDetails">
          <p>Chargement...</p>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container">
      <p data-i18n="footer.brand">Lumina </p>
      <p data-i18n="footer.right">French creator</p>
    </div>
  </footer>

  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      const urlParams = new URLSearchParams(window.location.search);
      const movieId = urlParams.get('id');
      if (!movieId) {
        document.getElementById('movieDetails').innerHTML = '<p>Film non trouvé.</p>';
        return;
      }

      try {
        const res = await fetch(`http://localhost:8001/api/movie/${movieId}?lang=${getLang()}`);
        if (!res.ok) throw new Error('Erreur de chargement');
        const movie = await res.json();

        const details = `
          <div class="card">
            <div class="card__header">
              <h1>${movie.title}</h1>
              ${movie.poster_path ? `<img src="https://image.tmdb.org/t/p/w300${movie.poster_path}" alt="${movie.title}" style="float: right; margin-left: 20px;" crossorigin="anonymous">` : ''}
              <p><strong>Sortie :</strong> ${movie.release_date || 'N/A'}</p>
              <p><strong>Note :</strong> ${movie.vote_average || 'N/A'}/10</p>
              <p><strong>Genres :</strong> ${movie.genres.join(', ') || 'N/A'}</p>
            </div>
            <div class="card__body">
              <h2>Histoire</h2>
              <p>${movie.overview || 'Pas de description disponible.'}</p>
              <h2>Acteurs principaux</h2>
              <p>${movie.cast.join(', ') || 'N/A'}</p>
              ${movie.director ? `<p><strong>Réalisateur :</strong> ${movie.director}</p>` : ''}
              ${movie.watch_providers.length ? `<h2>Où regarder</h2><p>${movie.watch_providers.join(', ')}</p>` : ''}
              ${movie.trailer ? `<h2>Trailer</h2><p><a href="${movie.trailer}" target="_blank">Voir le trailer sur YouTube</a></p>` : ''}
            </div>
          </div>
        `;
        document.getElementById('movieDetails').innerHTML = details;
      } catch (err) {
        document.getElementById('movieDetails').innerHTML = '<p>Erreur lors du chargement du film.</p>';
      }
    });
  </script>
</body>
</html>
